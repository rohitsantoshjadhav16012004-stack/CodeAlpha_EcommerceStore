<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CodeAlpha Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- HEADER -->
    <header class="auth-header">

        <a href="index.html" class="store-brand">

            <img
                src="/images/codealpha-logo.webp"
                alt="CodeAlpha Logo"
                class="codealpha-logo"
            >

            <div class="store-name">
                <strong>Store</strong>
                <span>Smart Shopping</span>
            </div>

        </a>

    </header>


    <!-- LOGIN -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🔐
            </div>

            <h1>Welcome Back!</h1>

            <p class="auth-subtitle">
                Login to continue shopping with CodeAlpha Store.
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login →
                </button>

            </form>


            <p
                id="message"
                class="auth-message"
            ></p>


            <div class="auth-divider">

                <span>
                    New to CodeAlpha Store?
                </span>

            </div>


            <a
                href="register.html"
                class="secondary-button"
            >
                Create an Account
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Store
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="auth-footer">

        © 2026 CodeAlpha Store • Built for learning and development

    </footer>


    <!-- LOGIN SCRIPT -->

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                try {

                    const response =
                        await fetch("/api/login", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message;

                        message.className =
                            "auth-message error";

                        return;

                    }


                    message.textContent =
                        data.message;

                    message.className =
                        "auth-message success";


                } catch (error) {

                    message.textContent =
                        "Server error. Please try again.";

                    message.className =
                        "auth-message error";

                }

            });

    </script>

</body>

</html>
